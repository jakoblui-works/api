[project]
name = "site-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.69.2",
    "sqlalchemy[asyncio]>=2.0.54",
    "types-aioboto3[s3]>=15.5",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
[tool.pytest.ini_options]
markers = [
    "covers_endpoint(name): mark a test as covering a specific route by its FastAPI route name",
]
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]  # errors, pyflakes, import sorting — a reasonable starting set

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["F401"]
