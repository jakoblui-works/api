services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DATABASE__USER:?DATABASE__USER missing}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD missing}
      POSTGRES_DB: ${DATABASE__NAME:?DATABASE__NAME missing}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    image: redis:8.10
    command: >
      redis-server 
      --requirepass ${REDIS__PASSWORD:?REDIS__PASSWORD missing}
      --appendonly yes 
      --maxmemory 256mb 
      --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
volumes:
  postgres-data:
  redis-data:
